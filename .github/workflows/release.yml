name: Release

# Pushing a tag like v0.1.0 builds the program and prepares a release for it.
#
# The release is created as a draft: nothing reaches players until someone
# opens it on GitHub, looks it over and presses "Publish release".
on:
  push:
    tags: ["v*"]

# No job may write to the repository unless it says so itself.
permissions:
  contents: read

jobs:
  # Building runs code from the dependencies (their build scripts) and the
  # tests, so this job gets no way of changing the repository at all.
  build:
    name: Build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable

      - name: The tag must match the version in Cargo.toml
        shell: bash
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi

      - name: Tests
        run: cargo test --locked -- --include-ignored --skip task_scheduler_really_runs_the_installed_copy

      - name: Build
        run: cargo build --release --locked

      - name: Checksum
        shell: bash
        working-directory: target/release
        run: sha256sum starstrings-updater.exe > starstrings-updater.exe.sha256

      # The licences of the libraries compiled into the program, for this exact build.
      - name: Third-party notices
        run: ./tools/third-party-notices.ps1 -Output target/release/THIRD-PARTY-NOTICES.txt

      - uses: actions/upload-artifact@v7
        with:
          name: release-files
          path: |
            target/release/starstrings-updater.exe
            target/release/starstrings-updater.exe.sha256
            target/release/THIRD-PARTY-NOTICES.txt
          if-no-files-found: error

  # Only this job may create the release, and it runs nothing from the project:
  # it takes the three finished files and attaches them.
  publish:
    name: Create the draft release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-files
          path: release-files

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            release-files/starstrings-updater.exe \
            release-files/starstrings-updater.exe.sha256 \
            release-files/THIRD-PARTY-NOTICES.txt \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --verify-tag \
            --title "StarStrings Updater $GITHUB_REF_NAME" \
            --generate-notes
