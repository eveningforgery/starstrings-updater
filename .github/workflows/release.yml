name: Release

# Pushing a tag like v0.2.0 builds the program and prepares a release for it.
#
# The release is created as a draft: nothing reaches players until someone
# opens it on GitHub, looks it over and presses "Publish release".
#
# Starting this workflow by hand ("Run workflow") is a rehearsal: it builds,
# tests and checks the release files exactly as a tag would, and stops short of
# creating anything.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# No job may write to the repository unless it says so itself.
permissions:
  contents: read

jobs:
  # Building runs code from the dependencies (their build scripts) and the
  # tests, so this job gets no way of changing the repository at all.
  build:
    name: Build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable

      - name: The tag must match the version in Cargo.toml
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi

      # In release mode, so that what the tests exercise is the very program
      # that gets published, not a debug build of the same source.
      - name: Tests
        run: cargo test --release --locked -- --include-ignored --skip task_scheduler_really_runs_the_installed_copy

      - name: Build
        run: cargo build --release --locked

      - name: The program starts and reports the right version
        shell: bash
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          reported=$(target/release/starstrings-updater.exe --version | tr -d '\r')
          echo "$reported"
          if [ "$reported" != "StarStrings Updater $version" ]; then
            echo "::error::expected 'StarStrings Updater $version'"
            exit 1
          fi

      - name: Checksum
        shell: bash
        working-directory: target/release
        run: sha256sum starstrings-updater.exe > starstrings-updater.exe.sha256

      # The licences of the libraries compiled into the program, for this exact build.
      - name: Third-party notices
        run: ./tools/third-party-notices.ps1 -Output target/release/THIRD-PARTY-NOTICES.txt

      - uses: actions/upload-artifact@v7
        with:
          name: release-files
          path: |
            target/release/starstrings-updater.exe
            target/release/starstrings-updater.exe.sha256
            target/release/THIRD-PARTY-NOTICES.txt
          if-no-files-found: error

  # Only this job may create the release, and it runs nothing from the project:
  # it takes the three finished files, checks them and attaches them.
  publish:
    name: Create the draft release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-files
          path: release-files

      - name: The files arrived intact
        working-directory: release-files
        run: |
          ls -l
          sha256sum --check starstrings-updater.exe.sha256
          test -s THIRD-PARTY-NOTICES.txt

      - name: Create the draft release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            release-files/starstrings-updater.exe \
            release-files/starstrings-updater.exe.sha256 \
            release-files/THIRD-PARTY-NOTICES.txt \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --verify-tag \
            --title "StarStrings Updater $GITHUB_REF_NAME" \
            --generate-notes

      - name: Rehearsal only
        if: github.ref_type != 'tag'
        run: echo "::notice::Rehearsal - the release files were built and checked, and nothing was published."
