# Once a month, propose updates for the libraries the program is built from and
# for the GitHub Actions the workflows use. Each kind arrives as a single pull
# request, and CI runs on it like on any other change.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    groups:
      rust-dependencies:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ["*"]
