# Link the C runtime statically so the released .exe is a single file with no
# dependency on the Visual C++ redistributable being installed.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

[target.aarch64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]
